<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ضغط ملفات PDF</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #4b2bbf, #9b4dff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .box {
      background: #fff;
      padding: 30px;
      border-radius: 20px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
      text-align: center;
    }
    h1 { color: #4b2bbf; margin-bottom: 10px; }
    p { color: #555; line-height: 1.5; }
    input, select, button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      background: #4b2bbf;
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:disabled {
      background: #999;
      cursor: not-allowed;
    }
    #status { margin-top: 15px; font-weight: bold; color: #4b2bbf; min-height: 25px; }
    #fileCount { margin-top: 10px; font-size: 14px; color: #333; }
  </style>
</head>
<body>
  <div class="box">
    <h1>ضغط ملفات PDF</h1>
    <p>اختار من 1 إلى 20 ملف PDF مرة واحدة. لو ملف واحد هينزل PDF بنفس الاسم. لو أكتر من ملف هينزل ZIP بجميع الملفات بأسمائها الأصلية.</p>

    <form id="form">
      <input id="pdfs" type="file" name="pdfs" accept=".pdf" multiple required />
      <div id="fileCount"></div>
      <select name="quality">
        <option value="strong">ضغط قوي جدًا</option>
        <option value="medium" selected>ضغط متوسط</option>
        <option value="light">ضغط خفيف وجودة أعلى</option>
      </select>
      <button id="btn" type="submit">ضغط الملفات</button>
    </form>
    <div id="status"></div>
  </div>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("pdfs");
    const status = document.getElementById("status");
    const fileCount = document.getElementById("fileCount");
    const btn = document.getElementById("btn");

    input.addEventListener("change", () => {
      const files = input.files.length;
      if (files > 20) {
        status.textContent = "مسموح برفع 20 ملف فقط";
        input.value = "";
        fileCount.textContent = "";
        return;
      }
      fileCount.textContent = files ? "عدد الملفات المختارة: " + files : "";
      status.textContent = "";
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const files = input.files;
      if (!files.length) { status.textContent = "اختار ملفات PDF أولاً"; return; }
      if (files.length > 20) { status.textContent = "مسموح برفع 20 ملف فقط"; return; }

      const formData = new FormData(form);
      btn.disabled = true;
      status.textContent = "جاري رفع وضغط الملفات...";

      try {
        const response = await fetch("/compress", { method: "POST", body: formData });
        if (!response.ok) {
          let msg = "حدث خطأ أثناء الضغط";
          try { const data = await response.json(); if(data.error) msg = data.error; } catch {}
          status.textContent = msg;
          btn.disabled = false;
          return;
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = files.length === 1 ? files[0].name : "compressed_files.zip";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        status.textContent = "تم الضغط والتحميل بنجاح";
      } catch (err) {
        status.textContent = "فشل الاتصال بالسيرفر";
      }

      btn.disabled = false;
    });
  </script>
</body>
</html>
